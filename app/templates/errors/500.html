{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}

{% block extra_styles %}
<style>
    .error-page {
        min-height: calc(100vh - var(--nav-h) - 100px);
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 5rem 2rem;
    }
    .error-code {
        font-size: 10rem; font-weight: 800; letter-spacing: -4px; line-height: 1;
        background: linear-gradient(135deg, #dc2626, #ea580c);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .error-title { font-size: 2.8rem; font-weight: 700; color: var(--text-main); margin: 1.5rem 0 1rem; }
    .error-msg { color: var(--text-muted); font-size: 1.5rem; margin-bottom: 3rem; }
    .btn-home {
        display: inline-flex; align-items: center; gap: 0.8rem;
        padding: 1.2rem 2.8rem;
        background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
        color: #fff; font-size: 1.45rem; font-weight: 600;
        border: none; border-radius: var(--radius-pill); text-decoration: none;
        box-shadow: 0 4px 16px rgba(2, 132, 199, 0.25);
    }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="fade-up">
        <div class="error-code">500</div>
        <h1 class="error-title">Internal Server Error</h1>
        <p class="error-msg">Something went wrong on our end. Please try again.</p>
        <a href="{{ url_for('main.home') }}" class="btn-home">
            <i class="fa-solid fa-house"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}
